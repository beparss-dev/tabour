<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --g: #0f5132; --g2: #17804f; --g3: #0b3d26;
    --ink: #1d2b24; --muted: #5d6b64; --bg: #f4f6f5; --line: #dfe6e2;
    --red: #a61b1b; --amber: #7a5600; --blue: #0b3d91;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); -webkit-text-size-adjust: 100%; }
  body { direction: rtl; font-family: -apple-system, "SF Arabic", "Segoe UI", Tahoma, sans-serif; padding-bottom: 96px; }
  button, input, select { font: inherit; }
  button { cursor: pointer; }

  .banner {
    background: linear-gradient(135deg, var(--g3), var(--g2)); color: #fff; text-align: center;
    padding: 14px 16px 16px; border-radius: 0 0 22px 22px; box-shadow: 0 6px 18px rgba(11, 61, 38, .25);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .bt { font-size: 28px; font-weight: 800; }
  .bs { font-size: 14px; color: #d4ecdf; margin-top: 4px; }
  .bs:empty { display: none; }

  main { max-width: 560px; margin: 0 auto; padding: 14px 16px; }
  main.wide { max-width: 900px; }
  .center { text-align: center; }
  .muted { color: var(--muted); font-size: 14px; }

  .status { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; }
  .count { font-size: 22px; font-weight: 800; color: var(--g); }

  .letters { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .letter { position: relative; height: 54px; border-radius: 12px; background: #fff; border: 1px solid var(--line); font-size: 23px; font-weight: 800; color: var(--ink); }
  .letter.all { grid-column: span 2; font-size: 17px; }
  .letter.on { background: var(--g); color: #fff; border-color: var(--g); }
  .letter.done { opacity: .35; }
  .letter .n { position: absolute; top: 3px; left: 6px; font-size: 11px; font-weight: 700; color: var(--muted); }
  .letter.on .n { color: #d4ecdf; }

  .names { display: flex; flex-direction: column; gap: 10px; }
  .name { width: 100%; min-height: 66px; border-radius: 16px; background: #fff; border: 1px solid var(--line); box-shadow: 0 2px 6px rgba(0, 0, 0, .04); font-size: 22px; color: var(--ink); text-align: right; padding: 12px 16px; line-height: 1.35; }
  .name b { font-weight: 800; }
  .name:active { background: #e6f2ec; }
  .name .tag { display: inline-block; font-size: 13px; color: var(--amber); background: #fff4d6; border-radius: 8px; padding: 2px 8px; margin-inline-start: 8px; vertical-align: middle; }
  .sep { font-size: 13px; color: var(--muted); margin: 6px 4px 0; }
  .empty { background: #fff; border: 1px dashed var(--line); border-radius: 14px; padding: 18px; text-align: center; color: var(--muted); }

  .toggle { display: block; width: 100%; margin: 18px 0 6px; border: 0; border-radius: 14px; background: #e3e9e6; color: var(--ink); font-size: 18px; font-weight: 700; padding: 14px; }
  .closed { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; text-align: center; font-size: 18px; margin-bottom: 12px; }

  section { background: #fff; border-radius: 14px; padding: 12px 14px; margin: 10px 0; border: 1px solid var(--line); }
  section h2 { font-size: 17px; margin: 4px 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eef2f0; font-size: 17px; flex-wrap: wrap; }
  .item:last-child { border-bottom: 0; }
  .item small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .act { border: 0; border-radius: 10px; background: #e3e9e6; color: var(--ink); font-size: 14px; padding: 9px 12px; white-space: nowrap; }
  .act.main { background: var(--g); color: #fff; }
  .act.warn { background: #fde8e8; color: var(--red); }
  .red h2 { color: var(--red); } .amber h2 { color: var(--amber); } .green h2 { color: var(--g); } .blue h2 { color: var(--blue); }
  .pill { display: inline-block; font-size: 12px; border-radius: 8px; padding: 2px 8px; background: #eef2f0; color: var(--muted); margin-inline-start: 6px; }
  .pill.red { background: #fde8e8; color: var(--red); } .pill.amber { background: #fff4d6; color: var(--amber); } .pill.green { background: #e3f3ea; color: var(--g); }
  .inline { display: flex; gap: 8px; align-items: center; width: 100%; margin-top: 8px; flex-wrap: wrap; }
  .inline input, .inline select { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; font-size: 16px; min-height: 42px; }
  .inline select { flex: 1; min-width: 180px; }

  .tabs { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 12px; padding-bottom: 4px; }
  .tabs button { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 20px; padding: 8px 14px; font-size: 15px; color: var(--ink); }
  .tabs button.on { background: var(--g); color: #fff; border-color: var(--g); }

  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
  .chip { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px; text-align: center; font-size: 13px; }
  .chip b { display: block; font-size: 22px; }
  .nav { display: flex; gap: 8px; flex-wrap: wrap; }
  .nav button { flex: 1; border: 0; border-radius: 12px; background: #e3e9e6; font-size: 15px; padding: 12px 6px; min-width: 90px; }
  .nav .print { background: var(--g); color: #fff; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .quick button { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; font-size: 14px; }
  .quick button.on { background: var(--g3); color: #fff; border-color: var(--g3); }
  .dates { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  .dates input { border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: #fff; font-size: 15px; }
  .period { font-size: 14px; color: var(--g3); background: #e3f3ea; border-radius: 10px; padding: 8px 12px; margin: 8px 0; }

  table.t { width: 100%; border-collapse: collapse; font-size: 15px; background: #fff; }
  table.t th, table.t td { border: 1px solid var(--line); padding: 8px; text-align: right; vertical-align: top; }
  table.t th { background: #eef4f1; }
  table.t td.n { text-align: center; white-space: nowrap; }

  .toast { position: fixed; left: 12px; right: 12px; bottom: 12px; max-width: 536px; margin: 0 auto; background: var(--g3); color: #fff; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 17px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); z-index: 9; }
  .toast[hidden] { display: none; }
  .toast button { border: 0; border-radius: 10px; background: #fff; color: var(--g3); font-size: 16px; font-weight: 800; padding: 10px 16px; }
  .toast button[hidden] { display: none; }

  /* ===== نموذج ١٨ — مساءلة عن تأخر / انصراف (صورةُ ورقة المدرسة) ===== */
  .f18 { background: #fff; color: #000; width: 182mm; max-width: 100%; margin: 0 auto 14px; padding: 6mm; font-family: "Simplified Arabic", "Traditional Arabic", "Times New Roman", serif; font-size: 12.5pt; line-height: 1.45; border: 1px solid var(--line); }
  .f18 .head { display: grid; grid-template-columns: 1fr 33mm 1fr; align-items: start; }
  .f18 .hr { font-weight: bold; font-size: 12.5pt; line-height: 1.6; justify-self: start; text-align: center; }
  .f18 .lg { text-align: center; padding-top: 2mm; }
  .f18 .lg img { width: 30mm; }
  .f18 .hl { font-size: 12pt; line-height: 2.1; padding-right: 6mm; }
  .f18 .dots { display: inline-block; min-width: 30mm; border-bottom: 1.2px dotted #000; }
  .f18 .fid { margin-top: 2mm; font-size: 12pt; text-align: left; }
  .f18 .fid div { display: inline-block; text-align: right; }
  .f18 hr.d { border: 0; border-top: 1.4px dashed #000; margin: 2mm 0 3mm; }
  .f18 hr.dd { border: 0; border-top: 3px double #000; margin: 3mm 0; }
  .f18 h1 { font-family: "Sakkal Majalla", "Traditional Arabic", serif; font-weight: bold; font-size: 20pt; margin: 0 0 3mm; }
  .f18 .box { display: grid; grid-template-columns: 46mm 1fr; border: 1.6px solid #000; margin-bottom: 3mm; }
  .f18 .box .l { border-left: 1.6px solid #000; padding: 1mm 3mm; font-weight: bold; }
  .f18 .box .v { padding: 1mm 3mm; }
  .f18 table { width: 100%; border-collapse: collapse; margin: 1mm 0 3mm; }
  .f18 th, .f18 td { border: 1.2px solid #000; text-align: center; padding: 1mm 2mm; }
  .f18 td { height: 8mm; }
  .f18 .row { display: flex; justify-content: space-between; }
  .f18 .ck { display: flex; align-items: center; gap: 3mm; margin: 1.1mm 0; padding-right: 2mm; }
  .f18 .ck .b { width: 5mm; height: 5mm; border: 1.3px solid #000; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .f18 .sp { display: inline-block; min-width: 12mm; text-align: center; }
  .f18 .sig { display: grid; grid-template-columns: 1.8fr 1fr .9fr; white-space: nowrap; margin-top: 1mm; }
  .f18 .ln { border-bottom: 1.2px dotted #000; height: 7mm; }
  .f18 .note { font-size: 11pt; }

  @media print {
    @page { size: A4; margin: 9mm 12mm 8mm; }
    .nav, .act, .acts, .toggle, .toast, .letters, .status, .closed, .tabs, .quick, .dates, .noprint, .inline { display: none !important; }
    body { background: #fff; padding: 0; }
    .banner { border-radius: 0; box-shadow: none; }
    section { border: 0; }
    main, main.wide { max-width: none; padding: 0; }
    body.forms .banner { display: none; }
    .f18 { border: 0; padding: 0; margin: 0; width: auto; page-break-after: always; break-after: page; }
    .f18:last-child { page-break-after: auto; break-after: auto; }
  }
</style>
</head>
<body>
<header class="banner">
  <div class="bt" id="title">تحضير الطابور</div>
  <div class="bs" id="who"></div>
  <div class="bs" id="day"></div>
</header>
<main id="app"><p class="muted center">جارٍ التحميل…</p></main>
<div id="toast" class="toast" hidden><span id="toastText"></span><button id="undo" type="button">تراجع</button></div>
<script>
'use strict';
/* تحضيرُ الطابور ومتابعةُ الدوام — الواجهة داخل Apps Script (google.script.run)
   الرصدُ كما هو · ومتابعةُ الدوام على الدليل الإجرائيّ: وكيلُ الشؤون المدرسية يفرز ويُصدر ويرفع · والمديرُ يقرّر */
var LOGO = 'https://beparss-dev.github.io/tabour/logo-black.png';
var K = '';           // مفتاحُ المسؤول — من رابط الصفحة
var S = null;         // حالةُ اليوم (الرصد)
var R = null;         // بياناتُ مدّة (التقارير · المتابعة · المساءلات · الاعتمادات)
var T = null;         // مدّةُ الحسم
var LETTER = '';
var VIEW = 'mark';    // mark · report · range · follow · approve · totals · forms · print
var DATE = '';        // يومُ التقرير ('' = اليوم)
var FDATE = '';       // يومُ المتابعة
var RANGE = { key: 'month', from: '', to: '' };
var PICK = {};        // المساءلاتُ المختارة للطباعة
var PRINT = [];       // ما يُعرض للطباعة
var OPEN = null;      // سطرٌ مفتوحٌ لكتابة وقت {name, kind}
var inflight = {}, undoAfter = {};
var toastTimer = null, undoName = '';
var pollTimer = null, lastTouch = 0, waking = null;

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
}

/* ===== الحروف ===== */
var ORDER = 'ابتثجحخدذرزسشصضطظعغفقكلمنهوي';
function norm1(c) { return c.replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه'); }
function words(n) { return String(n).trim().split(/\s+/); }
function firstL(n) { return norm1((words(n)[0] || '').charAt(0)); }
function lastL(n) {
  var w = words(n);
  if (w.length < 2) return '';
  var t = w[w.length - 1];
  if (t.indexOf('ال') === 0 && t.length > 3) t = t.slice(2);
  return norm1(t.charAt(0));
}
function shown(L) { return L === 'ا' ? 'أ' : L; }

/* ===== التاريخ: الهجريُّ أساسٌ والميلاديُّ بجواره ===== */
function D(d) { return new Date(d + 'T12:00:00'); }
function iso(t) { return t.toISOString().slice(0, 10); }
function addDays(d, n) { var t = D(d); t.setDate(t.getDate() + n); return iso(t); }
function fmt(d, cal) {
  try {
    return new Intl.DateTimeFormat('ar-SA-u-ca-' + cal, {
      weekday: cal === 'islamic-umalqura' ? 'long' : undefined, day: 'numeric', month: 'long', year: 'numeric'
    }).format(D(d));
  } catch (e) { return d; }
}
function hp(d) {
  var p = {};
  try {
    new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn', { day: 'numeric', month: 'numeric', year: 'numeric' })
      .formatToParts(D(d)).forEach(function (x) { p[x.type] = x.value; });
  } catch (e) {}
  return { d: parseInt(p.day, 10), m: parseInt(p.month, 10), y: parseInt(p.year, 10) };
}
function hShort(d) { var h = hp(d); return h.d + '/' + h.m + '/' + h.y; }
function weekday(d) { try { return new Intl.DateTimeFormat('ar-SA', { weekday: 'long' }).format(D(d)); } catch (e) { return ''; } }
function ar(s) { return String(s).replace(/\d/g, function (x) { return '٠١٢٣٤٥٦٧٨٩'.charAt(+x); }); }
function hm(m) { m = Number(m) || 0; var h = Math.floor(m / 60), r = m % 60; return (h ? h + ' س ' : '') + r + ' د'; }
function monthStart(d) { var x = d; for (var i = 0; i < 31 && hp(x).d > 1; i++) x = addDays(x, -1); return x; }

function rangeFor(key, today) {
  if (key === 'today') return [today, today];
  if (key === 'yesterday') { var y = addDays(today, -1); return [y, y]; }
  if (key === 'week') return [addDays(today, -D(today).getDay()), today];
  if (key === 'month') return [monthStart(today), today];
  if (key === 'lastmonth') { var e = addDays(monthStart(today), -1); return [monthStart(e), e]; }
  return [RANGE.from || today, RANGE.to || today];
}

/* ===== المحرّك ===== */
function api(action, p) {
  p = p || {};
  return new Promise(function (resolve, reject) {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)
      .apiCall(K, action, p.name || '', p.date || '', p.on || '');
  });
}
function api8(action, p) {
  return new Promise(function (resolve, reject) {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)
      .apiCall8(K, action, JSON.stringify(p || {}));
  });
}

function refresh() {
  return api('state', DATE ? { date: DATE } : {}).then(function (d) {
    if (d.error) { fatal(d.error); return; }
    S = d.state;
    if (VIEW === 'mark' || VIEW === 'report') render(false);
    schedule();
  }).catch(function () { netFail(); schedule(); });
}
function schedule() {
  clearTimeout(pollTimer);
  var fast = S && S.open && S.canAct && !document.hidden && VIEW === 'mark';
  pollTimer = setTimeout(refresh, fast ? 5000 : 60000);
}

/* خادمُ Google يتأخّر أحياناً دقائق (رأيناه) — فلا يبقى المستخدمُ أمام شاشةٍ صامتة */
function slowGuard() {
  var t = setTimeout(function () { toast('الخادمُ بطيءٌ الآن — انتظر قليلاً ولا تضغط مرّةً أخرى'); }, 12000);
  return function () { clearTimeout(t); };
}
function loadRange(from, to) {
  loading();
  var done = slowGuard();
  return api8('range', { from: from, to: to }).then(function (d) {
    done();
    if (d.error) { toast(d.error); return; }
    R = d.data;
    render(true);
  }).catch(function () { done(); toast('تعذّر الاتصال'); });
}
function loadTotals() {
  loading();
  var done = slowGuard();
  return api8('totals', {}).then(function (d) {
    done();
    if (d.error) { toast(d.error); return; }
    T = d.data;
    render(true);
  }).catch(function () { done(); toast('تعذّر الاتصال'); });
}
function loading() { $('app').innerHTML = '<p class="muted center">جارٍ التحميل…</p>'; }

/* يفتح الشاشةَ ويجلب بياناتِها */
function go(v) {
  VIEW = v;
  OPEN = null;
  window.scrollTo(0, 0);
  if (v === 'mark' || v === 'report') { render(true); return; }
  if (v === 'follow') { FDATE = FDATE || S.today; loadRange(FDATE, FDATE); return; }
  if (v === 'approve') { loadRange('2020-01-01', S.today); return; }
  if (v === 'totals') { loadTotals(); return; }
  var r = rangeFor(RANGE.key, S.today);
  RANGE.from = r[0]; RANGE.to = r[1];
  loadRange(r[0], r[1]);
}

/* ===== الرسم ===== */
function render(force) {
  if (!S) return;
  if (!force && Date.now() - lastTouch < 1200) { setTimeout(function () { render(false); }, 1300); return; }
  $('who').textContent = S.canAct ? 'شاشة ' + S.who : 'للاطّلاع والطباعة';
  var dayOf = VIEW === 'follow' ? FDATE : S.date;
  $('day').textContent = VIEW === 'report' || VIEW === 'mark' || VIEW === 'follow' ? fmt(dayOf, 'islamic-umalqura') + ' — ' + fmt(dayOf, 'gregory') : '';
  var marking = S.open && S.canAct && VIEW === 'mark' && S.date === S.today;
  document.body.className = VIEW === 'print' ? 'forms' : '';
  $('app').className = marking ? '' : 'wide';
  var h;
  if (marking) h = markHtml();
  else if (VIEW === 'mark' || VIEW === 'report') h = tabs('report') + reportHtml();
  else if (VIEW === 'range') h = tabs('range') + rangeHtml();
  else if (VIEW === 'follow') h = tabs('follow') + followHtml();
  else if (VIEW === 'approve') h = tabs('approve') + approveHtml();
  else if (VIEW === 'totals') h = tabs('totals') + totalsHtml();
  else if (VIEW === 'forms') h = tabs('forms') + formsHtml();
  else if (VIEW === 'print') h = printHtml();
  $('app').innerHTML = h;
  wake(marking);
}

function tabs(on) {
  var t = [['report', 'اليوم'], ['range', 'تقرير مدّة'], ['forms', 'المساءلات']];
  if (S.follow) t.push(['follow', 'متابعة الدوام']);
  if (S.approve) t.push(['approve', 'الاعتمادات']);
  t.push(['totals', 'مدّة الحسم']);
  return '<div class="tabs">' + t.map(function (x) {
    return '<button data-go="' + x[0] + '"' + (x[0] === on ? ' class="on"' : '') + '>' + x[1] + '</button>';
  }).join('') + '</div>';
}

/* ===== الرصد ===== */
function remaining() {
  var gone = {};
  S.present.forEach(function (p) { gone[p.name] = 1; });
  Object.keys(inflight).forEach(function (n) { gone[n] = 1; });
  return S.names.filter(function (n) { return !gone[n]; });
}

function markHtml() {
  var left = remaining(), leftSet = {}, exc = {};
  left.forEach(function (n) { leftSet[n] = 1; });
  var h = '<div class="status"><span class="count">حضر ' + (S.names.length - left.length) + ' من ' + S.names.length + '</span>' +
    '<span class="muted">التحضير حتى ' + S.end + '</span></div>';
  h += '<div class="letters"><button class="letter all' + (LETTER === '' ? ' on' : '') + '" data-l="">👥 الكلّ<span class="n">' + left.length + '</span></button>';
  ORDER.split('').forEach(function (L) {
    var all = S.names.filter(function (n) { return firstL(n) === L || lastL(n) === L; });
    if (!all.length) return;
    var rem = all.filter(function (n) { return leftSet[n]; }).length;
    h += '<button class="letter' + (LETTER === L ? ' on' : '') + (rem ? '' : ' done') + '" data-l="' + L + '">' + shown(L) + '<span class="n">' + rem + '</span></button>';
  });
  h += '</div>';
  var first = [], last = [];
  if (LETTER === '') first = left;
  else left.forEach(function (n) {
    if (firstL(n) === LETTER) first.push(n);
    else if (lastL(n) === LETTER) last.push(n);
  });
  h += '<div class="names">';
  if (!first.length && !last.length) h += '<div class="empty">' + (left.length ? 'لا أحد باقٍ تحت هذا الحرف ✓' : 'حضر الجميع ✓') + '</div>';
  first.forEach(function (n) { h += nameBtn(n, exc); });
  if (last.length) {
    h += '<div class="sep">— ومن اسم العائلة —</div>';
    last.forEach(function (n) { h += nameBtn(n, exc); });
  }
  h += '</div>';
  if (S.present.length) {
    h += '<section class="green"><h2>حضر (' + S.present.length + ')</h2>' + S.present.slice().reverse().map(function (p) {
      return '<div class="item"><span>' + esc(p.name) + '<small>' + p.time + (p.by ? ' · رصده ' + esc(p.by) : '') + '</small></span></div>';
    }).join('') + '</section>';

  return 'من ' + fmt(f, 'islamic-umalqura') + ' إلى ' + fmt(t, 'islamic-umalqura') + ' (' + fmt(f, 'gregory') + ' — ' + fmt(t, 'gregory') + ')';
}

/* غيرُ الحاضرين في المدّة: لكلّ معلّمٍ أيّامُه */
function absentByTeacher() {
  var m = {};

var ONLY_LINE = false;

}
function activeCases(date) { return R.cases.filter(function (c) { return c.date === date && c.status !== 'ملغاة'; }); }

    '<div class="ck"><span class="b">' + (c.status === 'عذر مقبول' ? '✓' : '') + '</span><span>عذر مقبول.</span></div>' +
    '<div class="ck"><span class="b">' + (c.status === 'يُحسم' ? '✓' : '') + '</span><span>عذر غير مقبول ويحسم عليه بعد اكتمال المدة المحددة (٧ ساعات أو ٤٢٠ دقيقة أو مضاعفاتها)</span></div>' +
    '<div class="sig"><span>مدير الإدارة / المكتب / المدرسة: ' + esc(R.principal) + '</span><span>التوقيع:</span><span>التاريخ: &nbsp; / &nbsp; / ١٤ هـ</span></div>' +
    '<hr class="d"><div class="note">ملاحظة: ترفق بطاقة المساءلة مع أصل القرار في حالة عدم قبول العذر لحفظها بملفه بالإدارة / المكتب / المدرسة.</div></div>';
}

/* ===== التصدير: Excel (CSV) · Word (.doc) — والـPDF من «طباعة» ⟵ «حفظ بتنسيق PDF» ===== */
function download(name, mime, text) {
  try {
    var blob = new Blob(['﻿' + text], { type: mime });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    toast('⬇ ' + name);
  } catch (e) { toast('تعذّر التنزيل في هذا الجهاز — استعمل «طباعة» ثمّ «حفظ PDF»'); }
}
function csv(rows) { return rows.map(function (r) { return r.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n'); }
function doc(title, body, forms) {
  var css = forms ? document.querySelector('style').textContent.split('/* ===== نموذج ١٨')[1].split('@media print')[0] : 'table{border-collapse:collapse;width:100%}td,th{border:1px solid #000;padding:4px}';
  return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>' + esc(title) +
    '</title><style>body{direction:rtl;font-family:"Simplified Arabic",serif}' + (forms ? '.f18{page-break-after:always}' : '') + css.replace(/^[^*]*\*\//, '') + '</style></head><body dir="rtl">' + body + '</body></html>';
}
function stampName(base) { return base + '-' + (R ? R.from + (R.to !== R.from ? '_' + R.to : '') : S.date); }
function doExport(kind) {
  var school = (R && R.school) || S.school || '';
  if (kind === 'day-csv' || kind === 'day-doc') {
    var head = 'تقرير الطابور — ' + school + ' — ' + fmt(S.date, 'islamic-umalqura');
    if (kind === 'day-csv') {
      var rows = [['الحالة', 'الاسم', 'الوقت', 'بيد']];
      S.absent.forEach(function (n) { rows.push(['لم يحضر', n, '', '']); });
      S.present.forEach(function (p) { rows.push(['حضر', p.name, p.time, p.by]); });
      download('الطابور-' + S.date + '.csv', 'text/csv;charset=utf-8', csv(rows));
    } else {
      download('الطابور-' + S.date + '.doc', 'application/msword', doc(head, '<h2>' + esc(head) + '</h2><h3>لم يحضر (' + S.absent.length + ')</h3><table><tr><th>م</th><th>الاسم</th></tr>' +
        S.absent.map(function (n, i) { return '<tr><td>' + (i + 1) + '</td><td>' + esc(n) + '</td></tr>'; }).join('') + '</table>'));
    }
  } else if (kind === 'range-csv' || kind === 'range-doc') {
    var rws = absentByTeacher(), title = 'غير الحاضرين للطابور — ' + school + ' — ' + periodText(R.from, R.to);
    if (kind === 'range-csv') {
      download(stampName('غير-الحاضرين') + '.csv', 'text/csv;charset=utf-8', csv([['م', 'الاسم', 'المرات', 'الأيام (هجري)']].concat(rws.map(function (r, i) {
        return [i + 1, r.name, r.dates.length, r.dates.map(hShort).join(' - ')];
      }))));
    } else download(stampName('غير-الحاضرين') + '.doc', 'application/msword', doc(title, '<h2>' + esc(title) + '</h2>' + rangeTable(rws)));
  } else if (kind === 'totals-csv' || kind === 'totals-doc') {
    if (kind === 'totals-csv') {
      download('مدة-الحسم-' + T.today + '.csv', 'text/csv;charset=utf-8', csv([['م', 'الاسم', 'المحسوم بالدقائق', 'عند المدير بالدقائق', 'أيام الحسم']].concat(T.list.map(function (x, i) {
        return [i + 1, x.name, x.cut, x.pending, Math.floor(x.cut / 420)];
      }))));
    } else download('مدة-الحسم-' + T.today + '.doc', 'application/msword', doc('مدة الحسم', '<h2>مدة الحسم — ' + esc(school) + '</h2>' + totalsTable()));
  } else if (kind === 'forms-doc' || kind === 'print-doc') {
    var list = kind === 'print-doc' ? PRINT : printable().filter(function (c) { return PICK[c.id]; });
    if (!list.length) { toast('اختر مساءلةً واحدةً على الأقلّ'); return; }
    download((list.length === 1 ? 'مساءلة-' + list[0].name : 'مساءلات-' + list.length) + '.doc', 'application/msword', doc('مساءلات', list.map(formHtml).join(''), true));
  }
}

/* ===== الأفعال ===== */
function mark(n) {
  inflight[n] = 1;
  render(true);
  toast('✓ حضّرتَ ' + n, n);
  api('mark', { name: n }).then(function (d) {
    delete inflight[n];
    if (d.error) { delete undoAfter[n]; toast(d.error); refresh(); return; }
    S = d.state;
    var r = d.result || {};
    if (r.state === 'already') { delete undoAfter[n]; toast('حضّره ' + (r.by || 'غيرُك') + ' الساعة ' + r.time); }
    else if (r.state === 'closed') { delete undoAfter[n]; toast('انتهى وقتُ التحضير'); }
    else if (undoAfter[n]) { delete undoAfter[n]; unmark(n); return; }
    render(true);
  }).catch(function () {
    delete inflight[n];
    delete undoAfter[n];
    toast('تعذّر الاتصال — اضغط الاسم مرّةً أخرى');
    render(true);
  });
}
function unmark(n) {
  return api('unmark', { name: n }).then(function (d) {
    if (d.state) S = d.state;
    render(true);
    toast('أُلغي تحضيرُ ' + n);
  }).catch(function () { toast('تعذّر الاتصال — لم يُلغَ التحضير'); });
}
function act(kind, n, extra, btn) {
  btn.disabled = true;
  var p = { name: n, date: VIEW === 'follow' ? FDATE : DATE };
  Object.keys(extra).forEach(function (k) { p[k] = extra[k]; });
  api(kind, p).then(function (d) {
    if (d.error) toast(d.error);
    if (VIEW === 'follow') { loadRange(FDATE, FDATE); return; }
    if (d.state) S = d.state;
    render(true);
  }).catch(function () { btn.disabled = false; toast('تعذّر الاتصال'); });
}
/* كتابةُ المتابعة — والردُّ يحمل بياناتِ اليوم من جديد */
function write(action, p, btn, okMsg) {
  if (btn) btn.disabled = true;
  var from = VIEW === 'follow' ? FDATE : R.from, to = VIEW === 'follow' ? FDATE : R.to;
  p.from = from; p.to = to;
  var done = slowGuard();
  return api8(action, p).then(function (d) {
    done();
    if (d.error) { toast(d.error); if (btn) btn.disabled = false; return; }
    R = d.data;
    OPEN = null;
    render(true);
    if (okMsg) toast(okMsg);
  }).catch(function () { done(); if (btn) btn.disabled = false; toast('تعذّر الاتصال — تأكّد ثمّ أعد المحاولة'); });
}
function issuePrefix() { var h = hp(S.today); return h.d + '/' + h.m + '/' + String(h.y).slice(-2); }

function shiftDay(step) {
  var d = addDays(S.date, step);
  if (d > S.today) return;
  DATE = d === S.today ? '' : d;
  VIEW = 'report';
  loading();
  refresh();
}

function toast(msg, undoFor) {
  clearTimeout(toastTimer);
  $('toastText').textContent = msg;
  undoName = undoFor || '';
  $('undo').hidden = !undoFor;
  $('toast').hidden = false;
  toastTimer = setTimeout(hideToast, undoFor ? 10000 : 4000);
}
function hideToast() { clearTimeout(toastTimer); $('toast').hidden = true; undoName = ''; }
function fatal(msg) {
  $('who').textContent = '';
  $('app').innerHTML = '<div class="closed">' + esc(msg) + '</div><p class="muted center">افتح التطبيق من رابطك الخاصّ.</p>';
}
function netFail() {
  if (!S) $('app').innerHTML = '<div class="closed">تعذّر الاتصال — تأكّد من الإنترنت</div>';
  else if ($('toast').hidden) toast('تعذّر الاتصال — يُعاد تلقائيّاً');
}
function wake(on) {
  if (waking === on) return;
  waking = on;
  try { window.top.postMessage({ tabourWake: on }, '*'); } catch (e) {}
}
function byId(id) { return R.cases.filter(function (c) { return c.id === id; })[0]; }
function showPrint(list, direct) {
  PRINT = list;
  PRINT.back = VIEW;
  VIEW = 'print';
  render(true);
  window.scrollTo(0, 0);
  if (direct) setTimeout(function () { window.print(); }, 300);
}

/* ===== التشغيل ===== */
document.addEventListener('pointerdown', function () { lastTouch = Date.now(); }, true);
$('app').addEventListener('change', function (e) {
  var id = e.target.getAttribute && e.target.getAttribute('data-pick');
  if (id) { PICK[id] = e.target.checked; render(true); }
});
$('app').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  var g = function (a) { return b.getAttribute(a); };
  if (b.hasAttribute('data-l')) { LETTER = g('data-l'); render(true); return; }
  if (b.hasAttribute('data-go')) { go(g('data-go')); return; }
  if (b.hasAttribute('data-d')) { shiftDay(Number(g('data-d'))); return; }
  if (b.hasAttribute('data-print')) { window.print(); return; }
  if (b.hasAttribute('data-export')) { doExport(g('data-export')); return; }
  if (b.hasAttribute('data-q')) { RANGE.key = g('data-q'); go(VIEW); return; }
  if (b.hasAttribute('data-apply')) { RANGE.key = 'custom'; RANGE.from = $('rf').value; RANGE.to = $('rt').value; if (RANGE.from && RANGE.to) loadRange(RANGE.from, RANGE.to); return; }
  if (b.hasAttribute('data-reload')) { go(VIEW); return; }
  if (b.hasAttribute('data-fd')) {
    var s = Number(g('data-fd'));
    var nd = s === 0 ? S.today : addDays(FDATE, s);
    if (nd > S.today) return;
    FDATE = nd; loadRange(FDATE, FDATE); return;
  }
  if (b.hasAttribute('data-open')) { OPEN = { name: g('data-n'), kind: g('data-open') }; render(true); return; }
  if (b.hasAttribute('data-close')) { OPEN = null; render(true); return; }
  if (b.hasAttribute('data-add')) { write('add', { date: FDATE, name: g('data-n'), kind: g('data-add') }, b); return; }
  if (b.hasAttribute('data-save')) { write('add', { date: FDATE, name: g('data-n'), kind: g('data-save'), at: $('at').value }, b); return; }
  if (b.hasAttribute('data-all')) { write('addAll', { date: FDATE }, b, 'سُجّل الجميع: عدم حضور الطابور'); return; }
  if (b.hasAttribute('data-early')) {
    if (!$('eln').value) { toast('اختر الاسم'); return; }
    write('add', { date: FDATE, name: $('eln').value, kind: 'انصراف مبكر', at: $('elt').value }, b); return;
  }
  if (b.hasAttribute('data-issue')) { write('issue', { ids: [g('data-issue')], prefix: issuePrefix() }, b, 'صدرت المساءلة'); return; }
  if (b.hasAttribute('data-issueall')) {
    var ids = activeCases(FDATE).filter(function (c) { return c.status === 'مسجّلة' && c.kind !== 'غياب'; }).map(function (c) { return c.id; });
    write('issue', { ids: ids, prefix: issuePrefix() }, b, 'صدرت ' + ids.length + ' مساءلة'); return;
  }
  if (b.hasAttribute('data-send')) { write('send', { id: g('data-send') }, b, 'رُفعت للمدير'); return; }
  if (b.hasAttribute('data-cancel')) { write('cancel', { id: g('data-cancel') }, b, 'أُلغيت'); return; }
  if (b.hasAttribute('data-decide')) { write('decide', { id: g('data-id'), accept: g('data-decide') === '1' }, b, 'سُجّل قرارك'); return; }
  if (b.hasAttribute('data-one')) { var c = byId(g('data-one')); if (c) showPrint([c], false); return; }
  if (b.hasAttribute('data-pickall')) { printable().forEach(function (c) { PICK[c.id] = true; }); render(true); return; }
  if (b.hasAttribute('data-picknone')) { PICK = {}; render(true); return; }
  if (b.hasAttribute('data-preview') || b.hasAttribute('data-direct')) {
    var list = printable().filter(function (c) { return PICK[c.id]; });
    if (!list.length) { toast('اختر مساءلةً واحدةً على الأقلّ'); return; }
    showPrint(list, b.hasAttribute('data-direct')); return;
  }
  var n = g('data-n');
  if (!n) return;
  if (b.classList.contains('name')) mark(n);
  else if (b.hasAttribute('data-u')) act('unmark', n, {}, b);
});
$('undo').addEventListener('click', function () {
  var n = undoName;
  hideToast();
  if (!n) return;
  if (inflight[n]) { undoAfter[n] = 1; delete inflight[n]; render(true); return; }
  unmark(n);
});
document.addEventListener('visibilitychange', function () { if (!document.hidden && (VIEW === 'mark' || VIEW === 'report')) refresh(); });

google.script.url.getLocation(function (loc) {
  K = (loc.parameter && loc.parameter.k) || '';
  if (!K) fatal('لا يوجد مفتاح'); else refresh();
});
</script>
